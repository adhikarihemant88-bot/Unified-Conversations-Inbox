services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inbox
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
    ports:
      - '5432:5432'
    volumes:
      - inbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inbox']
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  inbox-data:
